name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models/Xenova/all-MiniLM-L6-v2
          key: aide-embedding-model-all-MiniLM-L6-v2-v1

      - name: Download embedding model
        run: node scripts/fetch-model.mjs

      - name: Upload embedding model
        uses: actions/upload-artifact@v4
        with:
          name: aide-embedding-model
          path: models/Xenova/all-MiniLM-L6-v2
          if-no-files-found: error

  release:
    needs: prepare-model
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # node-gyp (bundled with @electron/rebuild) imports the stdlib `distutils`
      # module, which was removed in Python 3.12. The runner default Python is
      # now 3.12+, so native deps (e.g. bufferutil) fail to rebuild. Pin 3.11,
      # which still ships distutils.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download embedding model artifact
        uses: actions/download-artifact@v4
        with:
          name: aide-embedding-model
          path: models/Xenova/all-MiniLM-L6-v2

      # npm ci sometimes fails to install optional native bindings on Linux
      # due to an npm bug. Use npm pack + extract to bypass npm's logic entirely.
      - name: Ensure native bindings (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cd node_modules
          
          # @tailwindcss/oxide - required by @tailwindcss/postcss
          ver=$(node -p "require('./@tailwindcss/oxide/package.json').version")
          echo "@tailwindcss/oxide version: $ver"
          npm pack "@tailwindcss/oxide-linux-x64-gnu@${ver}" --quiet
          mkdir -p @tailwindcss/oxide-linux-x64-gnu
          tar -xzf tailwindcss-oxide-linux-x64-gnu-*.tgz
          mv package/* @tailwindcss/oxide-linux-x64-gnu/
          rm -rf package tailwindcss-oxide-linux-x64-gnu-*.tgz
          
          # lightningcss - required by tailwindcss/postcss
          ver=$(node -p "require('./lightningcss/package.json').version")
          echo "lightningcss version: $ver"
          npm pack "lightningcss-linux-x64-gnu@${ver}" --quiet
          mkdir -p lightningcss-linux-x64-gnu
          tar -xzf lightningcss-linux-x64-gnu-*.tgz
          mv package/* lightningcss-linux-x64-gnu/
          rm -rf package lightningcss-linux-x64-gnu-*.tgz
          
          # rollup - required by vite
          ver=$(node -p "require('./rollup/package.json').optionalDependencies['@rollup/rollup-linux-x64-gnu']")
          echo "rollup version: $ver"
          npm pack "@rollup/rollup-linux-x64-gnu@${ver}" --quiet
          mkdir -p @rollup/rollup-linux-x64-gnu
          tar -xzf rollup-rollup-linux-x64-gnu-*.tgz
          mv package/* @rollup/rollup-linux-x64-gnu/
          rm -rf package rollup-rollup-linux-x64-gnu-*.tgz
          
          # sharp - runtime image processing
          ver=$(node -p "require('./sharp/package.json').optionalDependencies['@img/sharp-linux-x64']")
          echo "sharp version: $ver"
          npm pack "@img/sharp-linux-x64@${ver}" --quiet
          mkdir -p @img/sharp-linux-x64
          tar -xzf img-sharp-linux-x64-*.tgz
          mv package/* @img/sharp-linux-x64/
          rm -rf package img-sharp-linux-x64-*.tgz
          
          echo "Installed:"
          ls -la @tailwindcss/oxide-linux-x64-gnu/*.node 2>/dev/null || echo "  oxide: MISSING"
          ls -la lightningcss-linux-x64-gnu/*.node 2>/dev/null || echo "  lightningcss: MISSING"
          ls -la @rollup/rollup-linux-x64-gnu/*.node 2>/dev/null || echo "  rollup: MISSING"
          ls -la @img/sharp-linux-x64/*.node 2>/dev/null || echo "  sharp: MISSING"

      # macOS runners sometimes miss native bindings too. Install build-time deps.
      # Install BOTH arm64 and x64 to handle runner architecture variations.
      - name: Ensure native bindings (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          cd node_modules
          
          # @tailwindcss/oxide - install both architectures
          ver=$(node -p "require('./@tailwindcss/oxide/package.json').version")
          echo "@tailwindcss/oxide version: $ver"
          
          npm pack "@tailwindcss/oxide-darwin-arm64@${ver}" --quiet
          mkdir -p @tailwindcss/oxide-darwin-arm64
          tar -xzf tailwindcss-oxide-darwin-arm64-*.tgz
          mv package/* @tailwindcss/oxide-darwin-arm64/
          rm -rf package tailwindcss-oxide-darwin-arm64-*.tgz
          
          npm pack "@tailwindcss/oxide-darwin-x64@${ver}" --quiet
          mkdir -p @tailwindcss/oxide-darwin-x64
          tar -xzf tailwindcss-oxide-darwin-x64-*.tgz
          mv package/* @tailwindcss/oxide-darwin-x64/
          rm -rf package tailwindcss-oxide-darwin-x64-*.tgz
          
          # lightningcss - install both architectures
          ver=$(node -p "require('./lightningcss/package.json').version")
          echo "lightningcss version: $ver"
          
          npm pack "lightningcss-darwin-arm64@${ver}" --quiet
          mkdir -p lightningcss-darwin-arm64
          tar -xzf lightningcss-darwin-arm64-*.tgz
          mv package/* lightningcss-darwin-arm64/
          rm -rf package lightningcss-darwin-arm64-*.tgz
          
          npm pack "lightningcss-darwin-x64@${ver}" --quiet
          mkdir -p lightningcss-darwin-x64
          tar -xzf lightningcss-darwin-x64-*.tgz
          mv package/* lightningcss-darwin-x64/
          rm -rf package lightningcss-darwin-x64-*.tgz
          
          # rollup - install both architectures
          ver=$(node -p "require('./rollup/package.json').optionalDependencies['@rollup/rollup-darwin-arm64']")
          echo "rollup version: $ver"
          
          npm pack "@rollup/rollup-darwin-arm64@${ver}" --quiet
          mkdir -p @rollup/rollup-darwin-arm64
          tar -xzf rollup-rollup-darwin-arm64-*.tgz
          mv package/* @rollup/rollup-darwin-arm64/
          rm -rf package rollup-rollup-darwin-arm64-*.tgz
          
          ver=$(node -p "require('./rollup/package.json').optionalDependencies['@rollup/rollup-darwin-x64']")
          npm pack "@rollup/rollup-darwin-x64@${ver}" --quiet
          mkdir -p @rollup/rollup-darwin-x64
          tar -xzf rollup-rollup-darwin-x64-*.tgz
          mv package/* @rollup/rollup-darwin-x64/
          rm -rf package rollup-rollup-darwin-x64-*.tgz
          
          echo "Installed:"
          ls -la @tailwindcss/oxide-darwin-arm64/*.node 2>/dev/null || echo "  oxide-arm64: MISSING"
          ls -la @tailwindcss/oxide-darwin-x64/*.node 2>/dev/null || echo "  oxide-x64: MISSING"
          ls -la lightningcss-darwin-arm64/*.node 2>/dev/null || echo "  lightningcss-arm64: MISSING"
          ls -la lightningcss-darwin-x64/*.node 2>/dev/null || echo "  lightningcss-x64: MISSING"
          ls -la @rollup/rollup-darwin-arm64/*.node 2>/dev/null || echo "  rollup-arm64: MISSING"
          ls -la @rollup/rollup-darwin-x64/*.node 2>/dev/null || echo "  rollup-x64: MISSING"

      - name: Download Playwright browser
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browsers
          
      # The Copilot CLI ships as platform-specific optional packages gated by
      # os/cpu, so explicitly install the CLI binary package(s) each packaged
      # target needs. Lifecycle scripts stay disabled; electron-builder handles
      # required native app dependency rebuilds during packaging.
      - name: Ensure Copilot CLI binaries for target archs
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@github/copilot/package.json','utf8')).optionalDependencies['@github/copilot-darwin-x64']")
          echo "Copilot CLI version: $ver"
          
          # npm's --os/--cpu flags don't reliably install cross-platform optional deps.
          # Download and extract both packages manually via npm pack.
          cd node_modules/@github
          
          # Install x64 (not installed by npm ci on arm64 runner)
          npm pack "@github/copilot-darwin-x64@${ver}" --quiet
          mkdir -p copilot-darwin-x64
          tar -xzf github-copilot-darwin-x64-*.tgz
          mv package/* copilot-darwin-x64/
          rm -rf package github-copilot-darwin-x64-*.tgz
          
          # Reinstall arm64 (may have been removed by npm operations)
          npm pack "@github/copilot-darwin-arm64@${ver}" --quiet
          mkdir -p copilot-darwin-arm64
          tar -xzf github-copilot-darwin-arm64-*.tgz
          mv package/* copilot-darwin-arm64/
          rm -rf package github-copilot-darwin-arm64-*.tgz
          
          cd ../..
          
          # Verify packages installed
          echo "x64 package contents:" && ls -la node_modules/@github/copilot-darwin-x64/
          echo "arm64 package contents:" && ls -la node_modules/@github/copilot-darwin-arm64/
          test -f "node_modules/@github/copilot-darwin-x64/copilot"
          test -f "node_modules/@github/copilot-darwin-arm64/copilot"

      # Sharp is a runtime dependency bundled into the app. The arm64 runner
      # only installs arm64 binaries, but we need x64 for the x64 build.
      - name: Ensure Sharp binaries for all target archs
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-darwin-x64']")
          echo "Sharp version: $ver"
          
          cd node_modules/@img
          
          # Install x64 sharp binary (not installed by npm ci on arm64 runner)
          npm pack "@img/sharp-darwin-x64@${ver}" --quiet
          mkdir -p sharp-darwin-x64
          tar -xzf img-sharp-darwin-x64-*.tgz
          mv package/* sharp-darwin-x64/
          rm -rf package img-sharp-darwin-x64-*.tgz
          
          # Install x64 libvips (required by sharp)
          libvips_ver=$(node -p "require('../sharp/package.json').optionalDependencies['@img/sharp-libvips-darwin-x64']")
          echo "Libvips version: $libvips_ver"
          npm pack "@img/sharp-libvips-darwin-x64@${libvips_ver}" --quiet
          mkdir -p sharp-libvips-darwin-x64
          tar -xzf img-sharp-libvips-darwin-x64-*.tgz
          mv package/* sharp-libvips-darwin-x64/
          rm -rf package img-sharp-libvips-darwin-x64-*.tgz
          
          cd ../..
          echo "Sharp x64 installed:" && ls node_modules/@img/ | grep darwin

      - name: Build & package (${{ matrix.platform }})
        # Publish only on a version tag. A manual workflow_dispatch run still
        # builds + packages (and uploads CI artifacts for verification) but is
        # forced to --publish never, so testing the pipeline can never push to
        # a GitHub Release.
        run: npm run dist:${{ matrix.platform }} -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip macOS code-signing when no certificate is configured, so CI
          # can still produce an (unsigned) build instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # --- macOS signing & notarization (optional) -----------------
          # Add these repo secrets to enable signed + notarized builds:
          #   CSC_LINK                     base64 of the Developer ID .p12
          #   CSC_KEY_PASSWORD             password for the .p12
          #   APPLE_ID                     Apple Developer account email
          #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password
          #   APPLE_TEAM_ID                10-char team id
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Windows signing via Azure Trusted Signing (optional) ----
          # Add these repo secrets to enable Windows signing:
          #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aide-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          draft: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
